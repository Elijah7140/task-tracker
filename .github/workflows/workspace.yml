name: CI

# Pull requests and pushes to main run on GitHub-hosted runners. See docs/CI.md.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Finish every main build so its history stays complete.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The jobs run in parallel. Each OS gets one checks job, two browser-test shards and
# two packaged-smoke shards.
jobs:
  checks:
    name: Build, check and Node tests (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          linux-desktop: "true"
      - run: pnpm run build
      - run: pnpm exec vp check --deny-warnings
      - name: Verify the Vite renderer responds
        shell: bash
        run: |
          pnpm --filter @task-tracker/web dev --host 127.0.0.1 --port 5173 --strictPort &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 \
            --output /dev/null http://127.0.0.1:5173/
      - run: pnpm run test:node
      # The server ships inside Electron, so its SQLite and RPC suites run only there.
      - name: Run SQLite and RPC tests under the Electron runtime
        run: pnpm run test:server-db:electron
      # Every installed copy of Electron's sandbox helper must be setuid root, as for the
      # packaged smoke (WP22).
      - name: Verify Electron runtime on Linux
        if: runner.os == 'Linux'
        run: |
          find node_modules/.pnpm -path '*/electron/dist/chrome-sandbox' -print0 |
            xargs -0 -r sh -c 'sudo chown root:root "$@" && sudo chmod 4755 "$@"' sh
          xvfb-run -a pnpm run check:electron
      - name: Verify Electron runtime on Windows
        if: runner.os == 'Windows'
        run: pnpm run check:electron

  browser:
    name: Browser tests (${{ matrix.platform }}, ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows]
        shard: [1, 2]
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          chromium: "true"
      - run: pnpm run test:browser --shard=${{ matrix.shard }}/2
      - name: Upload differing browser screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshot-diffs-${{ matrix.platform }}-${{ matrix.shard }}
          path: |
            .vitest/attachments/**/*.png
            test-results/**/*.png
          include-hidden-files: true
          if-no-files-found: ignore

  desktop:
    name: Packaged desktop smoke (${{ matrix.platform }}, ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows]
        shard: [1, 2]
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          linux-desktop: "true"
      # electron-builder downloads NSIS and 7-Zip on every Windows package otherwise.
      - name: Restore electron-builder downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/electron-builder
          key: electron-builder-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-builder-${{ runner.os }}-
      - run: pnpm run package:desktop
        env:
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder
      # The packaged Chromium sandbox helper must be setuid root (WP22).
      - name: Run packaged desktop smoke on Linux
        if: runner.os == 'Linux'
        run: |
          sandbox=apps/desktop/dist/package/linux-unpacked/chrome-sandbox
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          xvfb-run -a pnpm run test:desktop --shard=${{ matrix.shard }}/2
      - name: Run packaged desktop smoke on Windows
        if: runner.os == 'Windows'
        run: pnpm run test:desktop --shard=${{ matrix.shard }}/2
      - name: Upload desktop installers
        if: matrix.shard == 1
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}-x64
          path: |
            apps/desktop/dist/package/*.AppImage
            apps/desktop/dist/package/*.exe
          if-no-files-found: error
          retention-days: 7
