name: CI

# Pushes and pull requests use enabled self-hosted runners. See docs/CI.md.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      github_hosted:
        description: Use GitHub-hosted runners (billed minutes)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    if: inputs.github_hosted || vars.CI_LINUX_SELF_HOSTED == 'true'
    uses: ./.github/workflows/workspace-build.yml
    with:
      runner: ${{ inputs.github_hosted && '"ubuntu-latest"' || '["self-hosted", "linux", "x64"]' }}
      platform: linux

  windows:
    if: inputs.github_hosted || vars.CI_WINDOWS_SELF_HOSTED == 'true'
    uses: ./.github/workflows/workspace-build.yml
    with:
      runner: ${{ inputs.github_hosted && '"windows-latest"' || '["self-hosted", "windows", "x64"]' }}
      platform: windows
