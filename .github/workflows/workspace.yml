name: CI

# Every push and pull request runs on GitHub-hosted runners. See docs/CI.md.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Finish every main build so its history stays complete.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  workspace:
    name: Build and test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium and Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends xvfb xauth dbus
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: pnpm exec playwright install chromium
      - run: pnpm run build
      - run: pnpm exec vp check --deny-warnings
      - name: Verify the Vite renderer responds
        shell: bash
        run: |
          pnpm --filter @task-tracker/web dev --host 127.0.0.1 --port 5173 --strictPort &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 \
            --output /dev/null http://127.0.0.1:5173/
      # %TEMP% sits on the Windows runner's OS disk, where each flush to disk takes about
      # 4 ms and sometimes seconds. Tests that commit to SQLite files there timed out. The
      # runner's D: drive (RUNNER_TEMP) flushes in 0.1 ms. See docs/CI.md.
      - name: Keep temporary files off the Windows OS disk
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - run: pnpm exec vp test run
      - name: Run SQLite tests under the Electron runtime
        run: pnpm run test:server-db:electron
      # Every installed copy of Electron's sandbox helper must be setuid root, as for the
      # packaged smoke below (WP22).
      - name: Verify Electron runtime on Linux
        if: runner.os == 'Linux'
        run: |
          find node_modules/.pnpm -path '*/electron/dist/chrome-sandbox' -print0 |
            xargs -0 -r sh -c 'sudo chown root:root "$@" && sudo chmod 4755 "$@"' sh
          xvfb-run -a pnpm run check:electron
      - name: Verify Electron runtime on Windows
        if: runner.os == 'Windows'
        run: pnpm run check:electron
      - run: pnpm run package:desktop
      # The packaged Chromium sandbox helper must be setuid root (WP22).
      - name: Run packaged desktop smoke on Linux
        if: runner.os == 'Linux'
        run: |
          sandbox=apps/desktop/dist/package/linux-unpacked/chrome-sandbox
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          xvfb-run -a pnpm run test:desktop
      - name: Run packaged desktop smoke on Windows
        if: runner.os == 'Windows'
        run: pnpm run test:desktop
      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}-x64
          path: |
            apps/desktop/dist/package/*.AppImage
            apps/desktop/dist/package/*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Upload differing browser screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshot-diffs-${{ matrix.platform }}
          path: |
            .vitest/attachments/**/*.png
            test-results/**/*.png
          include-hidden-files: true
          if-no-files-found: ignore
