name: Release

# A pushed v* tag packages each platform on GitHub-hosted runners, then publishes
# one verified release. See README "Cut a release" and PLAN §7.13.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.ref_type == 'tag' && !github.event.deleted
    name: Package ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - target: win-x64
            runner: windows-latest
          - target: linux-x64
            runner: ubuntu-latest
          # Apple silicon. Ad-hoc signed only: there is no Apple Developer ID.
          - target: mac-arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Linux browser and Electron dependencies
        if: runner.os == 'Linux'
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends xvfb xauth dbus
      - name: Build the tagged package
        shell: bash
        run: pnpm run package:desktop "$GITHUB_REF_NAME"
      # The packaged Chromium sandbox helper must be setuid root (WP22).
      - name: Run packaged desktop smoke on Linux
        if: runner.os == 'Linux'
        run: |
          sandbox=apps/desktop/dist/package/linux-unpacked/chrome-sandbox
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          xvfb-run -a pnpm run test:desktop
      - name: Run packaged desktop smoke on Windows and macOS
        if: runner.os != 'Linux'
        run: pnpm run test:desktop
      # Installers, blockmaps, latest*.yml or beta*.yml, and SHA256SUMS.json from
      # the native build.
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: apps/desktop/dist/package/release/
          if-no-files-found: error
          overwrite: true

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The only job that can write: it creates the draft, uploads and publishes.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # Download each native build's verified payload into its own directory.
      - uses: actions/download-artifact@v4
        with:
          name: release-win-x64
          path: release-bundles/win-x64
      - uses: actions/download-artifact@v4
        with:
          name: release-linux-x64
          path: release-bundles/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: release-mac-arm64
          path: release-bundles/mac-arm64
      - name: Verify the release assembly
        run: node apps/desktop/scripts/publish-release.ts "$GITHUB_REF_NAME" release-bundles
      - name: Upload and publish the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/desktop/scripts/publish-release.ts "$GITHUB_REF_NAME" release-bundles --publish
