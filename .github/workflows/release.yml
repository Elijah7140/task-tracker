name: Release

# Pushing a tag such as v0.2.0 builds the Windows, Linux and macOS packages for version 0.2.0 and
# publishes them as a GitHub Release. Update checks in the app read these release files (§7.13).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
            channel: win
          - os: ubuntu-latest
            runtime: linux-x64
            channel: linux
          - os: macos-latest
            runtime: osx-arm64
            channel: osx
    runs-on: ${{ matrix.os }}
    env:
      UPDATE_FEED_URL: ${{ vars.TASKTRACKER_UPDATE_FEED_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Take the version from the tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Pack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/pack.ps1 -Runtime ${{ matrix.runtime }} -Version $env:VERSION -UpdateFeedUrl $env:UPDATE_FEED_URL
      - name: Pack (Linux and macOS)
        if: runner.os != 'Windows'
        run: bash scripts/pack.sh ${{ matrix.runtime }} "$VERSION" "$UPDATE_FEED_URL"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.channel }}
          path: artifacts/releases/${{ matrix.runtime }}
          if-no-files-found: error
          overwrite: true

  # One job uploads every channel in turn, so the three packages never race to create the release.
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts/releases
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-release.sh
