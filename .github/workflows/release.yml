name: Release

# A pushed v* tag packages each platform on GitHub-hosted runners, then publishes
# one verified release. See README "Cut a release" and PLAN §7.13.
on:
  push:
    tags: ["v*"]
  # A dry run does everything a release does except publish: it packages and
  # smoke-tests every platform and verifies the assembled files. Run it before
  # tagging, because nothing else builds the macOS package.
  workflow_dispatch:
    inputs:
      version:
        description: Version to rehearse, such as v0.2.0. Nothing is published.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The pushed tag, or the version a dry run rehearses.
  RELEASE_TAG: ${{ inputs.version || github.ref_name }}

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || (github.ref_type == 'tag' && !github.event.deleted)
    name: Package ${{ matrix.target }}
    strategy:
      # One platform's failure must not cancel the others' packaging and smoke.
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            runner: windows-latest
          - target: linux-x64
            runner: ubuntu-latest
          # Apple silicon. Ad-hoc signed only: there is no Apple Developer ID.
          - target: mac-arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The same setup as CI, so the smoke runs under the conditions CI proved.
      - uses: ./.github/actions/setup-workspace
        with:
          linux-desktop: "true"
      - name: Build the release package
        shell: bash
        run: pnpm run package:desktop "$RELEASE_TAG"
      # The packaged Chromium sandbox helper must be setuid root (WP22).
      - name: Run packaged desktop smoke on Linux
        if: runner.os == 'Linux'
        run: |
          sandbox=apps/desktop/dist/package/linux-unpacked/chrome-sandbox
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          xvfb-run -a pnpm run test:desktop
      - name: Run packaged desktop smoke on Windows and macOS
        if: runner.os != 'Linux'
        run: pnpm run test:desktop
      # Installers, blockmaps, latest*.yml or beta*.yml, and SHA256SUMS.json from
      # the native build.
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: apps/desktop/dist/package/release/
          if-no-files-found: error
          overwrite: true

  publish:
    name: Verify the assembly and publish a tagged release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The only job that can write: it creates the draft, uploads and publishes.
    # Only the publish step receives the token, and a dry run skips that step.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # Download each native build's verified payload into its own directory.
      - uses: actions/download-artifact@v8
        with:
          name: release-win-x64
          path: release-bundles/win-x64
      - uses: actions/download-artifact@v8
        with:
          name: release-linux-x64
          path: release-bundles/linux-x64
      - uses: actions/download-artifact@v8
        with:
          name: release-mac-arm64
          path: release-bundles/mac-arm64
      - name: Verify the release assembly
        run: node apps/desktop/scripts/publish-release.ts "$RELEASE_TAG" release-bundles
      - name: Upload and publish the verified draft
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/desktop/scripts/publish-release.ts "$RELEASE_TAG" release-bundles --publish
