name: CI

# Pushes and pull requests run on self-hosted runners, so they use no billed GitHub minutes
# (docs/CI.md). Each OS runs only when its repository variable is 'true':
#   CI_LINUX_SELF_HOSTED    a runner with the labels self-hosted, linux, x64 is online
#   CI_WINDOWS_SELF_HOSTED  a runner with the labels self-hosted, windows, x64 is online
# With a variable unset, that OS is skipped and the local gate (scripts/ci-local.*) covers it.
# A manual run can pick GitHub-hosted runners instead; those minutes are billed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      github_hosted:
        description: Use GitHub-hosted runners (billed minutes)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    if: inputs.github_hosted || vars.CI_LINUX_SELF_HOSTED == 'true'
    uses: ./.github/workflows/build.yml
    with:
      runs-on: ${{ inputs.github_hosted && '"ubuntu-latest"' || '["self-hosted", "linux", "x64"]' }}
      os-name: linux
      runtime: linux-x64
      channel: linux

  windows:
    if: inputs.github_hosted || vars.CI_WINDOWS_SELF_HOSTED == 'true'
    uses: ./.github/workflows/build.yml
    with:
      runs-on: ${{ inputs.github_hosted && '"windows-latest"' || '["self-hosted", "windows", "x64"]' }}
      os-name: windows
      runtime: win-x64
      channel: win
