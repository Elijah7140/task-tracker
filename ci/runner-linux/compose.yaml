# Starts the Task Tracker CI runner (docs/CI.md):
#   RUNNER_TOKEN=<registration token> docker compose up -d --build
services:
  runner:
    build: .
    init: true
    # Packaged Electron smoke runs with the Chromium sandbox enabled.
    cap_add:
      - SYS_ADMIN
    hostname: tasktracker-linux-runner
    restart: unless-stopped
    environment:
      RUNNER_URL: ${RUNNER_URL:-https://github.com/Elijah7140/task-tracker}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      RUNNER_NAME: ${RUNNER_NAME:-tasktracker-linux-runner}
    volumes:
      # Keep registration, runner updates and the job workspace across restarts.
      - runner:/home/runner/actions-runner

volumes:
  runner:
